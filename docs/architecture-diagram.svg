<text x="480" y="834.5" text-anchor="middle" class="n">G</text>
<circle cx="835" cy="445" r="11" fill="#7C3AED"/>
<text x="835" y="449.5" text-anchor="middle" class="n">K</text>
<text x="500" y="821" text-anchor="start" class="s" fill="#C2410C">browse the Gitea UI (HTTPS 443, admin login)</text>
<text x="1348" y="494" text-anchor="start" class="l" fill="#475569">read token</text>
<text x="1368" y="407" text-anchor="start" class="l" fill="#475569">mock mode</text>
<text x="1528" y="535" text-anchor="start" class="l" fill="#C2410C">real mode</text>
<rect x="30" y="860" width="800" height="125" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="46" y="884" text-anchor="start" class="pt" fill="#0f172a">Request flow</text>
<text x="46" y="906" text-anchor="start" class="pl" fill="#334155">1  Browser loads the static UI from CloudFront + S3 (HTTPS 443).</text>
<text x="46" y="924" text-anchor="start" class="pl" fill="#334155">2  Browser calls the thin API (/chat, /chat/approve, /dashboard/widgets) with the persona header.</text>
<text x="46" y="942" text-anchor="start" class="pl" fill="#334155">3  Thin API invokes AgentCore Runtime (SigV4); the agent reasons with Claude on Bedrock, history in Memory.</text>
<text x="46" y="960" text-anchor="start" class="pl" fill="#334155">4-5  Agent calls tools via the Gateway (MCP, SigV4), which invokes the four Lambda targets (DynamoDB or Gitea).</text>
<text x="46" y="978" text-anchor="start" class="pl" fill="#334155">Writes are gated: the first /chat returns a proposal and /chat/approve executes it.   K = keep-warm ping.</text>
<rect x="860" y="860" width="750" height="125" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="876" y="884" text-anchor="start" class="pt" fill="#0f172a">Deploy-time only (not in the request path)</text>
<text x="876" y="906" text-anchor="start" class="pl" fill="#334155">CDK (Python) -&gt; CloudFormation: 13 stacks in one AWS account, us-east-1.</text>
<text x="876" y="924" text-anchor="start" class="pl" fill="#334155">Container images (arm64 agent, Lambda bundles) are built on an EC2 Graviton builder reached over SSM,</text>
<text x="876" y="942" text-anchor="start" class="pl" fill="#334155">a workaround for the WorkSpaces VDI having no Docker.</text>
<text x="876" y="960" text-anchor="start" class="pl" fill="#334155">The frontend is built with the thin-API URL baked in, synced to S3 by hand, then CloudFront is invalidated.</text>
<text x="876" y="978" text-anchor="start" class="pl" fill="#334155">Not drawn: IAM roles, CloudWatch Logs, CDK bootstrap.</text>
</svg>