<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f7fb"/>
      <stop offset="1" stop-color="#e6f0f6"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2f8fd8"/>
      <stop offset="1" stop-color="#1b5e99"/>
    </radialGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>

  <text x="80" y="78" font-size="40" font-weight="700" fill="#1d2b36">With Mahalo</text>
  <text x="80" y="118" font-size="24" fill="#4f6577">One assistant that reads all five systems, and gives each role what it needs.</text>

  <!-- persona -> hub -->
  <g stroke="#2f8fd8" stroke-width="4" fill="none">
    <path d="M500 222 C 620 222, 640 420, 690 430"/>
    <path d="M500 362 C 600 362, 640 430, 680 440"/>
    <path d="M500 502 C 600 502, 640 460, 680 452"/>
    <path d="M500 642 C 620 642, 640 470, 690 462"/>
  </g>
  <!-- hub -> systems -->
  <g stroke="#2e9e6b" stroke-width="4" fill="none">
    <path d="M895 410 C 960 390, 990 205, 1100 200"/>
    <path d="M915 428 C 980 420, 1000 312, 1100 310"/>
    <path d="M925 445 L 1100 420"/>
    <path d="M915 462 C 980 470, 1000 528, 1100 530"/>
    <path d="M895 480 C 960 500, 990 635, 1100 640"/>
  </g>

  <g>
    <rect x="80" y="160" width="420" height="125" rx="18" fill="#ffffff" filter="url(#sh2)"/>
    <circle cx="132" cy="202" r="28" fill="#7b4fa0"/>
    <text x="132" y="211" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">DK</text>
    <text x="175" y="198" font-size="21" font-weight="700" fill="#1d2b36">David Kim, Executive</text>
    <text x="175" y="222" font-size="16" fill="#4f6577">"Where is crypto payments?"</text>
    <rect x="105" y="240" width="370" height="34" rx="17" fill="#e3f4ea"/>
    <text x="290" y="263" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Every stage of a feature in one answer</text>

    <rect x="80" y="300" width="420" height="125" rx="18" fill="#ffffff" filter="url(#sh2)"/>
    <circle cx="132" cy="342" r="28" fill="#1f7a6d"/>
    <text x="132" y="351" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">MC</text>
    <text x="175" y="338" font-size="21" font-weight="700" fill="#1d2b36">Marcus Chen, Product Manager</text>
    <text x="175" y="362" font-size="16" fill="#4f6577">"/JIRA_ROADMAP PAY"</text>
    <rect x="105" y="380" width="370" height="34" rx="17" fill="#e3f4ea"/>
    <text x="290" y="403" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Story and two-sprint plan in minutes</text>

    <rect x="80" y="440" width="420" height="125" rx="18" fill="#ffffff" filter="url(#sh2)"/>
    <circle cx="132" cy="482" r="28" fill="#2a6fb0"/>
    <text x="132" y="491" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">MY</text>
    <text x="175" y="478" font-size="21" font-weight="700" fill="#1d2b36">Maya Chaya, Architect</text>
    <text x="175" y="502" font-size="16" fill="#4f6577">"Review the design for PAY-109"</text>
    <rect x="105" y="520" width="370" height="34" rx="17" fill="#e3f4ea"/>
    <text x="290" y="543" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Design review before the code</text>

    <rect x="80" y="580" width="420" height="125" rx="18" fill="#ffffff" filter="url(#sh2)"/>
    <circle cx="132" cy="622" r="28" fill="#c46a1b"/>
    <text x="132" y="631" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">LD</text>
    <text x="175" y="618" font-size="21" font-weight="700" fill="#1d2b36">Lava Dev, Developer</text>
    <text x="175" y="642" font-size="16" fill="#4f6577">"Write it, review it, commit it"</text>
    <rect x="105" y="660" width="370" height="34" rx="17" fill="#e3f4ea"/>
    <text x="290" y="683" text-anchor="middle" font-size="17" font-weight="700" fill="#1f7a4d">Story to reviewed commit</text>
  </g>

  <circle cx="800" cy="445" r="125" fill="url(#hub)" filter="url(#sh2)"/>
  <circle cx="800" cy="445" r="140" fill="none" stroke="#2f8fd8" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  <text x="800" y="415" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">Mahalo</text>
  <text x="800" y="450" text-anchor="middle" font-size="18" fill="#dcecf9">one chat</text>
  <text x="800" y="474" text-anchor="middle" font-size="18" fill="#dcecf9">one dashboard</text>
  <text x="800" y="498" text-anchor="middle" font-size="18" fill="#dcecf9">a briefing at login</text>
  <text x="800" y="522" text-anchor="middle" font-size="18" fill="#dcecf9">reusable skills</text>

  <g>
    <rect x="1100" y="160" width="420" height="80" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="1130" y="195" font-size="25" font-weight="700" fill="#1d2b36">Jira</text>
    <text x="1130" y="223" font-size="16" fill="#4f6577">sprints, stories, capacity, comments</text>

    <rect x="1100" y="270" width="420" height="80" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="1130" y="305" font-size="25" font-weight="700" fill="#1d2b36">Confluence</text>
    <text x="1130" y="333" font-size="16" fill="#4f6577">designs, policies, runbooks</text>

    <rect x="1100" y="380" width="420" height="80" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="1130" y="415" font-size="25" font-weight="700" fill="#1d2b36">Git</text>
    <text x="1130" y="443" font-size="16" fill="#4f6577">branches, commits, pull requests</text>

    <rect x="1100" y="490" width="420" height="80" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="1130" y="525" font-size="25" font-weight="700" fill="#1d2b36">CI/CD</text>
    <text x="1130" y="553" font-size="16" fill="#4f6577">test runs, security scans</text>

    <rect x="1100" y="600" width="420" height="80" rx="16" fill="#ffffff" filter="url(#sh2)"/>
    <text x="1130" y="635" font-size="25" font-weight="700" fill="#1d2b36">ServiceNow</text>
    <text x="1130" y="663" font-size="16" fill="#4f6577">deployments, incidents</text>
  </g>
  <text x="1310" y="718" text-anchor="middle" font-size="18" font-style="italic" fill="#1f7a4d">story, commit, pipeline, deploy and incident linked</text>

  <rect x="80" y="775" width="1440" height="95" rx="18" fill="#1d2b36"/>
  <text x="110" y="812" font-size="16" font-weight="700" fill="#9fc4e0" letter-spacing="1">BUILT-IN TRUST</text>
  <g font-size="19" font-weight="600" fill="#ffffff">
    <circle cx="125" cy="843" r="9" fill="#2e9e6b"/><text x="145" y="850">A human approves every write</text>
    <circle cx="475" cy="843" r="9" fill="#2e9e6b"/><text x="495" y="850">Only developers commit code</text>
    <circle cx="810" cy="843" r="9" fill="#2e9e6b"/><text x="830" y="850">A second AI model reviews the code</text>
    <circle cx="1205" cy="843" r="9" fill="#2e9e6b"/><text x="1225" y="850">Plan numbers computed by code</text>
  </g>
</svg>
